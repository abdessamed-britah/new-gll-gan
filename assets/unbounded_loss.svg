<svg xmlns="http://www.w3.org/2000/svg" width="680" height="286" viewBox="0 0 680 286" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The unbounded degradation loss</title>
  <desc>The degradation estimate drifts from near zero down to minus 1.57 over 80 training epochs, into a region below the clean level where no real image can sit. A clamp at zero removes that region.</desc>
  <rect width="680" height="286" rx="12" fill="#FFFFFF"/>

  <text x="90" y="46" font-size="14" font-weight="600" fill="#2C2C2A">Degradation estimate L_R of the generated image (unclamped run)</text>

  <rect x="90" y="110" width="520" height="132" rx="4" fill="#D85A30" fill-opacity="0.08"/>
  <line x1="90" y1="110" x2="610" y2="110" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/>

  <text x="96" y="100" font-size="12" fill="#0F6E56">Clamp floor added at 0 (fix)</text>
  <text x="610" y="100" text-anchor="end" font-size="12" fill="#5F5E5A">0 = clean image</text>

  <polyline points="100,120 220,155 350,179 480,223 600,228" fill="none" stroke="#D85A30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="120" r="3" fill="#D85A30"/>
  <circle cx="220" cy="155" r="3" fill="#D85A30"/>
  <circle cx="350" cy="179" r="3" fill="#D85A30"/>
  <circle cx="480" cy="223" r="3" fill="#D85A30"/>
  <circle cx="600" cy="228" r="3" fill="#D85A30"/>

  <text x="330" y="208" text-anchor="middle" font-size="12" fill="#993C1D">No real image can score here</text>
  <text x="600" y="248" text-anchor="end" font-size="12" fill="#993C1D">−1.57</text>
  <text x="100" y="268" font-size="12" fill="#5F5E5A">epoch 1</text>
  <text x="610" y="268" text-anchor="end" font-size="12" fill="#5F5E5A">epoch 80</text>
</svg>
