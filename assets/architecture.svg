<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DLL-GAN architecture</title>
  <desc>A degraded image passes through the generator to produce a restored image, which is scored by three losses: a discriminator, a frozen degradation regressor, and an L1 distance to the clean target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="280" rx="12" fill="#FFFFFF"/>

  <rect x="60" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="130" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Degraded image</text>

  <line x1="204" y1="62" x2="264" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="34" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Generator G</text>
  <text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">9 residual blocks</text>

  <line x1="414" y1="62" x2="474" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="550" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Restored image</text>

  <path d="M550 88 V130 H130 V174" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 130 V174" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 130 V174" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="180" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="130" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Discriminator D</text>
  <text x="130" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">real or fake per pixel</text>

  <rect x="250" y="180" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="340" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Regressor R, frozen</text>
  <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">estimates degradation</text>

  <rect x="460" y="180" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="550" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">L1 distance</text>
  <text x="550" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">vs clean target</text>

  <text x="340" y="262" text-anchor="middle" font-size="12" fill="#5F5E5A">L_G = L_GAN + λ·L1 + L_R  (only G and D are trained; R stays frozen)</text>
</svg>
